services:
  # Menambahkan service PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: anjeli_postgres_container
    restart: always
    environment:
      POSTGRES_USER: anjeli23
      POSTGRES_PASSWORD: anjelicantikbanget
      POSTGRES_DB: anjeli_store_db
    ports:
      # Format: PortDiKomputer:PortDiContainerDocker
      - "5432:5432"
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data

volumes:
  postgres_data_volume:
